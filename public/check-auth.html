<!DOCTYPE html>
<html>
<head>
    <title>Check Authentication</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Check Authentication Status</h1>
    <button onclick="checkAuth()">Check Auth Status</button>
    <div id="result"></div>

    <script>
        async function checkAuth() {
            const result = document.getElementById('result');
            result.innerHTML = '<p>Checking...</p>';

            try {
                const response = await fetch('/api/debug/subscription');
                const data = await response.json();

                if (response.ok) {
                    result.innerHTML = `
                        <h2 class="success">✅ User is authenticated</h2>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else if (response.status === 401) {
                    result.innerHTML = `
                        <h2 class="error">❌ User is NOT authenticated</h2>
                        <p>Please log in first.</p>
                        <p><a href="/auth/login">Go to Login</a></p>
                    `;
                } else {
                    result.innerHTML = `<p class="error">Error: ${data.error}</p>`;
                }
            } catch (error) {
                result.innerHTML = `<p class="error">Error: ${error.message}</p>`;
            }
        }

        // Auto-check on page load
        checkAuth();
    </script>
</body>
</html>
