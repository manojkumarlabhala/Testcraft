<!DOCTYPE html>
<html>
<head>
    <title>Complete Debug Check</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; max-height: 300px; overflow-y: auto; }
        .error { color: red; }
        .success { color: green; }
        .warning { color: orange; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Complete Debug Check for AI Chat Access</h1>
    <button onclick="runAllChecks()">Run All Checks</button>
    <div id="results"></div>

    <script>
        async function runAllChecks() {
            const results = document.getElementById('results');
            results.innerHTML = '<p>Running checks...</p>';

            const checks = [
                checkAuth,
                checkSubscription,
                checkChatAPI,
                checkAnalyticsAPI
            ];

            const resultsData = {};

            for (const check of checks) {
                try {
                    const result = await check();
                    resultsData[check.name] = result;
                } catch (error) {
                    resultsData[check.name] = { success: false, error: error.message };
                }
            }

            displayResults(resultsData);
        }

        async function checkAuth() {
            const response = await fetch('/api/debug/subscription');
            const data = await response.json();

            if (response.ok) {
                return {
                    success: true,
                    message: 'User is authenticated',
                    data: data
                };
            } else {
                return {
                    success: false,
                    message: 'User is not authenticated',
                    status: response.status,
                    error: data.error
                };
            }
        }

        async function checkSubscription() {
            const response = await fetch('/api/payments/subscription-status');
            const data = await response.json();

            if (response.ok) {
                const hasAccess = data.plan === 'Student Elite' && data.isActive;
                return {
                    success: hasAccess,
                    message: hasAccess ? 'User has chat access' : 'User does not have chat access',
                    data: data
                };
            } else {
                return {
                    success: false,
                    message: 'Failed to get subscription status',
                    status: response.status,
                    error: data.error
                };
            }
        }

        async function checkChatAPI() {
            const response = await fetch('/api/ai/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: 'Test message',
                    conversationHistory: []
                })
            });

            const data = await response.json();

            if (response.ok) {
                return {
                    success: true,
                    message: 'Chat API is working',
                    data: data
                };
            } else {
                return {
                    success: false,
                    message: 'Chat API failed',
                    status: response.status,
                    error: data.error
                };
            }
        }

        async function checkAnalyticsAPI() {
            const response = await fetch('/api/analytics?timeRange=7d');
            const data = await response.json();

            if (response.ok) {
                return {
                    success: true,
                    message: 'Analytics API is working',
                    data: data
                };
            } else {
                return {
                    success: false,
                    message: 'Analytics API failed',
                    status: response.status,
                    error: data.error
                };
            }
        }

        function displayResults(results) {
            const resultsDiv = document.getElementById('results');

            let html = '<h2>Debug Results</h2>';

            for (const [checkName, result] of Object.entries(results)) {
                const statusClass = result.success ? 'success' : 'error';
                const statusIcon = result.success ? '✅' : '❌';

                html += `
                    <div class="section">
                        <h3 class="${statusClass}">${statusIcon} ${checkName.replace('check', '')}</h3>
                        <p><strong>Status:</strong> <span class="${statusClass}">${result.message}</span></p>
                        ${result.status ? `<p><strong>HTTP Status:</strong> ${result.status}</p>` : ''}
                        ${result.error ? `<p><strong>Error:</strong> <span class="error">${result.error}</span></p>` : ''}
                        ${result.data ? `<pre>${JSON.stringify(result.data, null, 2)}</pre>` : ''}
                    </div>
                `;
            }

            // Summary
            const allSuccessful = Object.values(results).every(r => r.success);
            html += `
                <div class="section ${allSuccessful ? 'success' : 'error'}">
                    <h3>${allSuccessful ? '✅' : '❌'} Overall Status</h3>
                    <p>${allSuccessful ?
                        'All checks passed! AI Chat should be accessible.' :
                        'Some checks failed. Please fix the issues above.'}
                    </p>
                </div>
            `;

            resultsDiv.innerHTML = html;
        }

        // Auto-run checks on page load
        runAllChecks();
    </script>
</body>
</html>
