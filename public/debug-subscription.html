<!DOCTYPE html>
<html>
<head>
    <title>Debug Subscription Status</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Debug Subscription Status</h1>
    <button onclick="checkStatus()">Check My Subscription Status</button>
    <div id="result"></div>

    <script>
        async function checkStatus() {
            const result = document.getElementById('result');
            result.innerHTML = '<p>Loading...</p>';

            try {
                const response = await fetch('/api/debug/subscription');
                const data = await response.json();

                if (response.ok) {
                    result.innerHTML = `
                        <h2>User Info:</h2>
                        <pre>${JSON.stringify(data.user, null, 2)}</pre>

                        <h2>Profile:</h2>
                        <pre>${JSON.stringify(data.profile, null, 2)}</pre>

                        <h2>Subscription:</h2>
                        <pre>${JSON.stringify(data.subscription, null, 2)}</pre>

                        <h2>Debug Info:</h2>
                        <pre>${JSON.stringify(data.debug, null, 2)}</pre>

                        <h2>Chat Access Check:</h2>
                        <p class="${data.subscription.plan === 'Student Elite' && data.subscription.isActive ? 'success' : 'error'}">
                            ${data.subscription.plan === 'Student Elite' && data.subscription.isActive ?
                                '✅ User CAN access AI chat' :
                                '❌ User CANNOT access AI chat'}
                        </p>
                    `;
                } else {
                    result.innerHTML = `<p class="error">Error: ${data.error}</p>`;
                }
            } catch (error) {
                result.innerHTML = `<p class="error">Error: ${error.message}</p>`;
            }
        }

        // Auto-check on page load
        checkStatus();
    </script>
</body>
</html>
