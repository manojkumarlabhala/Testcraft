<!DOCTYPE html>
<html>
<head>
    <title>Test AI Chat API</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Test AI Chat API</h1>
    <button onclick="testChatAPI()">Test Chat API</button>
    <div id="result"></div>

    <script>
        async function testChatAPI() {
            const result = document.getElementById('result');
            result.innerHTML = '<p>Testing...</p>';

            try {
                const response = await fetch('/api/ai/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: 'Hello, can you help me with my studies?',
                        conversationHistory: []
                    })
                });

                const data = await response.json();

                result.innerHTML = `
                    <h2>Response Status: ${response.status}</h2>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                    <p class="${response.ok ? 'success' : 'error'}">
                        ${response.ok ? '✅ API call successful' : '❌ API call failed'}
                    </p>
                `;
            } catch (error) {
                result.innerHTML = `<p class="error">Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
